name: SHReminders
version: '${project.version}'
main: org.Cry_Legende.sHReminders.SHReminders
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, les rappels restent locaux à ce serveur comme avant.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (rappels en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shreminders:
    description: Planifie un rappel pour un joueur et administre les rappels.
    usage: /shreminders <schedule|import|reload|list>
    # Une sous-commande se délègue seule : la commande est ouverte à qui a l'un de ces droits
    permission: shreminders.admin.schedule;shreminders.admin.import;shreminders.admin.reload;shreminders.admin.list

permissions:
  shreminders.admin:
    description: Toute l'administration de SHReminders.
    default: op
    children:
      shreminders.admin.schedule: true
      shreminders.admin.import: true
      shreminders.admin.reload: true
      shreminders.admin.list: true
  shreminders.admin.schedule:
    description: Programmer un rappel pour un joueur (/shreminders schedule).
    default: op
  shreminders.admin.import:
    description: Avec SHNetwork, reprendre reminders.yml dans la base du réseau.
    default: op
  shreminders.admin.reload:
    description: Recharger config.yml et messages.yml.
    default: op
  shreminders.admin.list:
    description: Consulter les rappels en attente.
    default: op
