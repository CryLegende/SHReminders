# Messages de SHReminders. Codes couleur &. Un message vide n'est pas envoyé.
# Variables : %id% (identifiant du rappel), %player% (joueur), %count% (nombre), %subcommands% (sous-commandes que
# l'expéditeur peut utiliser), %file% (fichier illisible), %error% (cause), %time% (temps restant), %done% et %max%
# (répétitions), %more% (lignes non affichées), %main% et %repeats% (état d'un rappel dans list).

# Commandes
no_permission: "&7&l« &c&lSH &8&l» &7Vous n'avez pas la &cpermission&7."
usage: "&7&l« &e&lSH &8&l» &7Utilisation : &e/shreminders <%subcommands%>&7."
schedule_usage: "&7&l« &c&lSH &8&l» &7Utilisation : &c/shreminders schedule <joueur> <id>&7."
unknown_reminder: "&7&l« &c&lSH &8&l» &7Aucun rappel dans la configuration pour l'id '&c%id%&7'."
player_not_found_local: "&7&l« &c&lSH &8&l» &7Le joueur '&c%player%&7' n'a pas été trouvé ou n'a jamais joué sur ce serveur."
scheduled: "&7&l« &a&lSH &8&l» &7Rappel '&a%id%&7' programmé pour &a%player%&7."
import_inactive: "&7&l« &c&lSH &8&l» &7L'importation demande &cSHNetwork &7et &creseau.actif: true &7dans config.yml."

# /shreminders reload
reloaded: "&7&l« &a&lSH &8&l» &7Configuration et messages &arechargés&7 (&a%count% &7rappels configurés)."
