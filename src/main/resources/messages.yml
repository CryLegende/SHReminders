reload_orphans_network: "&7&l« &6&lSH &8&l» &6%count% &7rappel(s) en attente ont un identifiant absent de config.yml : ce serveur les &6ignore&7."
reload_restart: "&7&l« &6&lSH &8&l» &6reseau.* &7a changé : un redémarrage est nécessaire pour qu'il soit pris en compte."

# /shreminders list
list_empty: "&7&l« &e&lSH &8&l» &7Aucun rappel en attente."
