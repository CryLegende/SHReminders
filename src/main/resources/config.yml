# Configuration pour le plugin SHReminders

# --- COMMANDES ---
# /shreminders schedule <joueur> <id_rappel_config>
#   Description: Programme un rappel pour un joueur (même hors ligne) basé sur une configuration
#                définie dans la section "reminders" de ce fichier.
#                Si un rappel avec le même <id_rappel_config> existe déjà pour ce joueur, il est remplacé.
#                L'ancienne forme /shreminders <joueur> <id_rappel_config> fonctionne toujours.
#   Permission: shreminders.admin.schedule
#   Exemple: /shreminders schedule Notch monPremierRappel
#     -> Va chercher la configuration sous "reminders.monPremierRappel:"
#
# /shreminders import
#   Description: Avec SHNetwork, reprend reminders.yml dans la base partagée, sans toucher aux rappels qui y sont déjà.
#   Permission: shreminders.admin.import
#
# /shreminders reload
#   Description: Recharge config.yml et messages.yml. Un fichier illisible annule le rechargement : l'ancienne
#                configuration reste active et le fichier fautif est indiqué. reminders.yml et la base ne sont pas
#                touchés. Les rappels en attente dont l'identifiant n'est plus dans config.yml sont signalés : en mode
#                local ils sont supprimés. La section "reseau" n'est lue qu'au démarrage.
#   Permission: shreminders.admin.reload
#
# /shreminders list [joueur]
#   Description: Rappels en attente : le nombre par identifiant, ou ceux d'un joueur avec le temps restant.
#   Permission: shreminders.admin.list
#
# shreminders.admin donne toutes les permissions ci-dessus (op par défaut) ; chacune se donne aussi séparément.
# Alias : aucun. Les textes des commandes sont dans messages.yml.
#
# --- PLUSIEURS SERVEURS DE JEU ---
# Avec SHNetwork (voir la section "reseau" plus bas), les rappels sont dans la base partagée et chaque rappel n'est déclenché
# qu'une fois pour tout le réseau : la commande console part d'un seul serveur, titre, message, barre d'action et son sont
# affichés par le serveur où se trouve le joueur. Les textes du mode réseau sont dans messages.yml.

# --- PLACEHOLDERS (Nécessite PlaceholderAPI) ---
# Les placeholders affichent le temps restant avant le prochain déclenchement d'un rappel spécifique
# pour le joueur actuel.
#
# Format: %shreminders_next_<id_placeholder>%
#
#   <id_placeholder> peut être:
#     1. La valeur de la clé "placeholderId" définie dans la configuration du rappel.
#        Exemple: Si dans "reminders.monVote:", vous avez "placeholderId: vote",
#                 le placeholder sera %shreminders_next_vote%
#
#     2. Si "placeholderId" n'est pas défini, ce sera l'<id_rappel_config> "nettoyé"
#        (converti en minuscules, sans caractères spéciaux).
#        Exemple: Si l'ID du rappel est "SuperRappel!", le placeholder serait
#                 %shreminders_next_superrappel%
#
#   Valeurs retournées par le placeholder:
#     - Compte à rebours formaté (défini par 'placeholderCountdownFormat') si un rappel est en attente.
#     - Message spécifique (défini dans 'placeholderMessages') si le rappel est terminé,
#       n'existe pas, ou dans d'autres états.
#       Par défaut "none" ou "Terminé" selon la situation.
#
# Exemples de placeholders:
#   %shreminders_next_vote%
#   %shreminders_next_quetejournaliere%
#
# --- STRUCTURE DE CONFIGURATION D'UN RAPPEL ---
# reminders:
#   <id_rappel_config>:   # Identifiant unique pour ce type de rappel
#     delay: <minutes>    # Délai en minutes avant le premier déclenchement
#     command: "<commande>" # Commande à exécuter (console), %player% est remplacé
#     title: "<texte>"      # Titre à afficher au joueur (supporte les codes couleurs &)
#     subtitle: "<texte>"   # Sous-titre
#     message: "<texte>"    # Message dans le chat
#     actionbar: "<texte>"  # Message dans l'action bar
#     sound: "<NOM_DU_SON>" # Nom du son Bukkit (ex: ENTITY_PLAYER_LEVELUP)
#     soundVolume: <nombre> # Volume du son (ex: 1.0)
#     soundPitch: <nombre>  # Tonalité du son (ex: 1.0)
#     placeholderId: "<id_court>" # (Optionnel) ID court pour le placeholder
#
#     repeat:               # (Optionnel) Section pour les rappels répétitifs
#       enabled: <true|false>
#       delay: <minutes>    # Délai en minutes entre chaque répétition
#       maxRepeat: <nombre> # Nombre maximum de répétitions (-1 pour infini)
#       # Les clés title, subtitle, message, command, actionbar, sound, soundVolume, soundPitch
#       # peuvent aussi être définies ici pour la répétition, avec un comportement spécifique.

# --- CONFIGURATION GÉNÉRALE DES PLACEHOLDERS ---
# (Voir plus bas dans le fichier pour placeholderMessages et placeholderCountdownFormat)

# Début de votre configuration réelle ci-dessous
# -------------------------------------------------
placeholderCountdownFormat: "{h}h {m}m {s}s"

# Messages retournés par les placeholders selon l'état du rappel
placeholderMessages:
  triggeredNoRepeat: "none"   # Rappel déclenché sans répétition activée
  repeatFinished: "none"      # Toutes les répétitions terminées
  mainDoneNoRepeat: "none"    # Rappel principal exécuté, pas de répétition en cours
  notFound: "none"            # Aucun rappel trouvé pour cet identifiant

# Plusieurs serveurs de jeu : actif seulement si SHNetwork est installé ; sans lui, ou avec actif: false, rien ne change
# (tout reste dans reminders.yml). Avec SHNetwork, les rappels sont dans la base ci-dessous, partagée par tous les serveurs :
#   - /shreminders programme un rappel pour un joueur connecté sur n'importe quel serveur, ou hors ligne ;
#   - chaque serveur tente de réclamer en base les rappels échus, un seul y parvient : lui seul exécute la commande console
#     et annonce le rappel aux autres serveurs, qui l'affichent si le joueur est chez eux ;
#   - une répétition n'est réclamée que par le serveur où se trouve le joueur ;
#   - %shreminders_next_...% lit une copie en mémoire, relue après chaque changement ;
#   - reminders.yml n'est plus lu ni écrit : /shreminders import le reprend dans la base.
# Tous les serveurs doivent avoir les mêmes rappels dans config.yml. Demande un redémarrage : tout le bloc.
reseau:
  actif: true
  # Canal du bus SHNetwork : changements de la base et rappels déclenchés
  canal: shreminders
  # Table des comptes connus du réseau (colonnes name en minuscules et display_name) : retrouve un joueur par son pseudo
  # avec /shreminders même s'il ne s'est jamais connecté sur ce serveur.
  # Vide : seuls les joueurs connectés sur le réseau ou déjà venus sur ce serveur sont retrouvés.
  table-comptes: "Global.sh_track_firstseen"
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shreminders
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion à la base, en millisecondes. Une base qui ne répond pas fait échouer la commande
    # avec un message ; les rappels échus attendent qu'elle revienne.
    delai-ms: 5000

